# Example nginx config for production. Replace the server_name values with the
# real hostnames, then let certbot add the TLS blocks:
#   sudo certbot --nginx -d <api-host> -d <admin-host> -d <vendor-host>
#
# The panels are served as static files from the `current` release, so a deploy
# or rollback switches them together with the API — no process to restart.

# ── API ──────────────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name api.example.com;

    client_max_body_size 20m;

    location / {
        proxy_pass         http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# ── Admin panel ──────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name admin.example.com;

    root /home/ubuntu/happilee-prod/current/apps/admin/dist;
    index index.html;

    # Hashed assets never change: cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, or browsers keep loading the previous
    # release's bundle after a deploy.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}

# ── Vendor panel ─────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name vendor.example.com;

    root /home/ubuntu/happilee-prod/current/apps/vendor/dist;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
